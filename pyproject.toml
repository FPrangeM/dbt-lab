[project]
name = "dbt-lab"
version = "0.1.0"
requires-python = ">=3.12, <3.13"
dependencies = [
    "dbt[duckdb]>=1.0.0.40.21",
    "dbt-clickhouse>=1.10.2",
    "duckdb>=1.5.5",
    "duckdb-engine>=0.17.0",
    "ipykernel>=7.3.0",
    "pandas>=3.0.5",
    "sqlalchemy>=2.0.52",
    "dbt-duckdb>=1.11.0",
    "bash-kernel>=0.10.0",
    "jupyterlab>=4.6.3",
    "prefect[dbt]>=3.8.6",
    "slackify-markdown>=0.2.4",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
